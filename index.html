html,body{height:100%;margin:0}

.app{display:flex;flex-direction:column;height:100%}
header{display:flex;align-items:center;gap:14px;flex-wrap:wrap;padding:12px 16px;background:var(--panel);border-bottom:1px solid var(--line)}

.spacer{flex:1}

.main{display:flex;flex:1;min-height:0}
.side{width:322px;flex:none;display:flex;flex-direction:column;min-height:0;border-right:1px solid var(--line);background:var(--panel)}
.search{padding:14px 16px 10px;border-bottom:1px solid var(--line-soft)}
.search label{display:block;font-size:11px;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);margin-bottom:6px}
.search input{width:100%;font:inherit;padding:9px 11px;border-radius:9px;border:1px solid var(--line);background:var(--ground);color:var(--ink)}
.hint{margin:7px 0 0;font-size:11.5px;color:var(--muted)}
.scroll{overflow-y:auto;flex:1;min-height:0}
.sec{padding:12px 16px 4px;font-size:11px;letter-spacing:.07em;text-transform:uppercase;color:var(--muted)}
.list{list-style:none;margin:0;padding:0 8px 16px;display:flex;flex-direction:column;gap:2px}
.list button{width:100%;text-align:left;font:inherit;cursor:pointer;border:0;background:transparent;color:var(--ink);padding:8px 10px;border-radius:8px;display:flex;align-items:center;gap:10px}
.list button:hover{background:var(--line-soft)}
.list button[aria-current="true"]{background:var(--accent-soft)}
.dot{width:11px;height:11px;border-radius:3px;flex:none}
.nm{flex:1;min-width:0;overflow-wrap:anywhere}
.ct{font-size:11.5px;color:var(--muted);font-variant-numeric:tabular-nums}
.res-zone{font-size:11.5px;color:var(--muted)}

.foot{padding:9px 16px;border-top:1px solid var(--line);background:var(--panel);font-size:11.5px;color:var(--muted)}

    "Северо-Восток":["СПБ-ГРАЖДАНКА","СПБ-ОЗЕРКИ","СПБ-ПАРНАС","ЛО-1 БУГРЫ","ЛО-1 ДЕВЯТКИНО","ЛО-1 ДРАНИШНИКИ","ЛО-1 КАМЕНКА","ЛО-1 КАПИТОЛОВО","ЛО-1 КОРАБСЕЛЬКИ","ЛО-1 МЕНДСАРЫ","ЛО-1 МИСТОЛОВО","ЛО-1 МУРИНО-1","ЛО-1 НОВОЕ ДЕВЯТКИНО","ЛО-1 Новое Мурино","ЛО-1 ПАРГОЛОВО","ЛО-1 ПОРОШКИНО","ЛО-1 СЕРТОЛОВО","ЛО-1 ЭНКОЛОВО","ЛО-1 ЮККИ","ЛО-2 АГАЛАТОВО","ЛО-2 ВАРТЕМЯГИ","ЛО-2 КАСИМОВО","ЛО-2 КУЗЬМОЛОВО","ЛО-2 КУЯЛОВО","ЛО-2 ЛЕВАШОВО","ЛО-2 ЛУППОЛОВО","ЛО-2 МЕДНОЕ ОЗЕРО","ЛО-2 НОВО-ТОКСОВО","ЛО-2 РАППОЛОВО","ЛО-2 СКОТНОЕ","ЛО-2 СЯРЬГИ","ЛО-2 ТОКСОВО"],
    "Северо-Запад":["СПБ-АКАДЕМКА","СПБ-КОМЕНДАНТСКИЙ","СПБ-ЛАХТА","СПБ-ЛЕСНОЙ","СПБ-ПИОНЕРСКАЯ","СПБ-ПИОН-КОЛОМЯГИ","СПБ-СТАРАЯ ДЕРЕВНЯ","СПБ-УДЕЛЬНАЯ","ЛО-1 ГОРСКАЯ","ЛО-1 ОЛЬГИНО","ЛО-1 ЮНТОЛОВО","ЛО-2 БЕЛООСТРОВ","ЛО-2 ЗАПАДНАЯ ЛИЦА","ЛО-2 ЛИСИЙ НОС","ЛО-2 РЕПИНО","ЛО-2 СЕСТРОРЕЦК","ЛО-3 ЗЕЛЕНОГОРСК","ЛО-3 КОМАРОВО","ЛО-3 КРОНШТАДТ","ЛО-3 ЛЕНИНСКОЕ","ЛО-3 РОЩИНО"],
    "СЗ - Центр":["СПБ-ВЫБОРГСКАЯ СТОРОНА","СПБ-ПЕТРОГРАДСКАЯ СТОРОНА","СПБ-ЧЕРНАЯ РЕЧКА"],
    "ЮВ - Центр":["СПБ-ЦЕНТР(верх)","СПБ-ЦЕНТР(низ)"],
    "Юго-Восток":["СПБ-ЗВЕЗДНАЯ","СПБ-КУПЧИНО","СПБ-НЕВСКИЙ РАЙОН","СПБ-РЫБАЦКОЕ","ЛО-1 МЕТАЛЛСТРОЙ","ЛО-1 ПОНТОННЫЙ","ЛО-1 ПУЛКОВО","ЛО-1 ПУЛКОВСКОЕ","ЛО-1 ШУШАРЫ","ЛО-1 Шушары Промка","ЛО-2 АЛЕКСАНДРОВСКАЯ","ЛО-2 КОЛПИНО","ЛО-2 ЛЕНСОВЕТСКИЙ","ЛО-2 МОСКОВСКАЯ-СЛАВЯНКА","ЛО-2 ПАВЛОВСК","ЛО-2 ПЕТРО-СЛАВЯНКА","ЛО-2 ПУШКИН","ЛО-2 САПЕРНЫЙ","ЛО-2 ТЕЛЬМАНА","ЛО-2 УЛЬЯНОВКА","ЛО-3 ГЛИНКА","ЛО-3 КОММУНАР","ЛО-3 КРАСНЫЙ БОР"],
    "Юго-Запад":["СПБ-АВТОВО","СПБ-КИРОВСКИЙ РАЙОН","СПБ-МОСКОВСКИЙ РАЙОН","СПБ-НАРВСКАЯ","СПБ-ЮГО-ЗАПАД","ЛО-1 АНИНО НИЗ","ЛО-1 ПЕТЕРГОФ","ЛО-1 СТАРО-ПАНОВО","ЛО-1 СТРЕЛЬНА","ЛО-2 АНИНО ВЕРХ","ЛО-2 ГОРБУНКИ","ЛО-2 ГОРЕЛОВО","ЛО-2 КОНДАКОПШИНО","ЛО-2 КРАСНОЕ СЕЛО","ЛО-2 МАЛОЕ КАРЛИНО","ЛО-2 НИЗИНО","ЛО-2 НОВОСЕЛЬЕ","ЛО-2 РАЗБЕГАЕВО","ЛО-2 ТАЙЦЫ","ЛО-3 ГАТЧИНА","ЛО-3 ГОСТИЛИЦЫ","ЛО-3 Кипень","ЛО-3 ЛОМОНОСОВ","ЛО-3 РОПША"],
    "ЮЗ - Центр":["СПБ-ВАСИЛЬЕВСКИЙ ОСТРОВ"]
  }
};

const PAL=["--z1","--z2","--z3","--z4","--z5","--z6","--z7","--z8"];
const CITY_META={msk:{c:[55.75,37.62],z:9,label:"Москва"},spb:{c:[59.93,30.33],z:9,label:"Петербург"}};
const cssv=n=>getComputedStyle(document.documentElement).getPropertyValue(n).trim();
const map=L.map("map",{zoomControl:true}).setView(CITY_META.msk.c,CITY_META.msk.z);
const BASE={
  "Схема":L.tileLayer("https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png",{subdomains:"abcd",maxZoom:20,attribution:"© OpenStreetMap, © CARTO"}),
  "Светлая":L.tileLayer("https://{s}.basemaps.cartocdn.com/rastertiles/light_all/{z}/{x}/{y}{r}.png",{subdomains:"abcd",maxZoom:20,attribution:"© OpenStreetMap, © CARTO"}),
  "OSM":L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png",{maxZoom:19,attribution:"© OpenStreetMap"})
};
BASE["Схема"].addTo(map);
L.control.layers(BASE,null,{position:"topright"}).addTo(map);
let layers=[],city="msk",selected=null;
function parsePoly(s){const out=[],re=/\(\s*(-?\d+(?:\.\d+)?)\s*,\s*(-?\d+(?:\.\d+)?)\s*\)/g;let m;while((m=re.exec(s)))out.push([parseFloat(m[1]),parseFloat(m[2])]);return out}
function build(){
  layers.forEach(l=>map.removeLayer(l.poly));layers=[];
  ZONES[city].forEach((z,i)=>{
    const col=cssv(PAL[i%PAL.length]);
    const poly=L.polygon(parsePoly(z.p),{color:col,weight:2,fillColor:col,fillOpacity:.18}).addTo(map);
    const places=(PLACES[city][z.n]||[]);
    poly.bindTooltip(z.n,{permanent:map.getZoom()>=10,direction:"center",className:"zt",opacity:.95});
    poly.bindPopup("<b>"+z.n+"</b><br>"+places.length+" районов и н/п<br><span style='font-size:11px;color:#5F6E66'>"+places.slice(0,12).join(", ")+(places.length>12?"…":"")+"</span>");
    poly.on("click",()=>select(i,false));
    layers.push({poly,name:z.n,col,places});
  });
  map.setView(CITY_META[city].c,CITY_META[city].z);
}
function select(i,fly){
  selected=i;
  layers.forEach((l,j)=>l.poly.setStyle({fillOpacity:j===i?.42:.14,weight:j===i?3:2}));
  if(fly)map.fitBounds(layers[i].poly.getBounds(),{padding:[24,24]});
  layers[i].poly.openPopup();
  render(document.getElementById("q").value);
  document.getElementById("foot").textContent=layers[i].name+" · "+layers[i].places.length+" районов и населённых пунктов";
}
function render(query){
  const q=(query||"").trim().toLowerCase(),listEl=document.getElementById("list"),sec=document.getElementById("sec-title"),hint=document.getElementById("hint");
  listEl.innerHTML="";
  if(!q){
    sec.textContent="Зоны РЦ — "+CITY_META[city].label;
    layers.forEach((l,i)=>{
      const li=document.createElement("li"),b=document.createElement("button");b.type="button";
      if(selected===i)b.setAttribute("aria-current","true");
      const d=document.createElement("span");d.className="dot";d.style.background=l.col;
      const n=document.createElement("span");n.className="nm";n.textContent=l.name;
      const c=document.createElement("span");c.className="ct";c.textContent=l.places.length;
      b.append(d,n,c);b.onclick=()=>select(i,true);li.appendChild(b);listEl.appendChild(li);
    });
    hint.textContent="Начните вводить — покажу, в какую зону РЦ попадает адрес.";return;
  }
  const hits=[];
  layers.forEach((l,i)=>l.places.forEach(p=>{if(p.toLowerCase().includes(q))hits.push({p,zone:l.name,i,c:l.col})}));
  sec.textContent=hits.length?"Найдено: "+hits.length:"Ничего не найдено";
  if(!hits.length){const li=document.createElement("li");li.className="empty";li.textContent="Попробуйте название района, округа или посёлка: Химки, Купчино, Мурино, ЮВАО.";listEl.appendChild(li);hint.textContent="Ищем по районам и населённым пунктам, а не по улицам.";return}
  hits.slice(0,60).forEach(h=>{
    const li=document.createElement("li"),b=document.createElement("button");b.type="button";
    const d=document.createElement("span");d.className="dot";d.style.background=h.c;
    const w=document.createElement("span");w.className="nm";
    const t1=document.createElement("div");t1.textContent=h.p;
    const t2=document.createElement("div");t2.className="res-zone";t2.textContent=h.zone;
    w.append(t1,t2);b.append(d,w);b.onclick=()=>select(h.i,true);li.appendChild(b);listEl.appendChild(li);
  });
  hint.textContent="Нажмите на результат — зона подсветится на карте.";
}
function setCity(c){
  city=c;selected=null;
  document.getElementById("btn-msk").setAttribute("aria-pressed",String(c==="msk"));
  document.getElementById("btn-spb").setAttribute("aria-pressed",String(c==="spb"));
  build();render(document.getElementById("q").value);
  document.getElementById("foot").textContent=CITY_META[c].label+" · "+layers.length+" зон приёмки пакетов от РЦ · подложка OpenStreetMap";
}
document.getElementById("btn-msk").onclick=()=>setCity("msk");
document.getElementById("btn-spb").onclick=()=>setCity("spb");
document.getElementById("q").addEventListener("input",e=>render(e.target.value));
map.on("zoomend",()=>{
  const perm=map.getZoom()>=10;
  layers.forEach(l=>{
    const t=l.poly.getTooltip();
    if(!t||t.options.permanent===perm)return;
    l.poly.unbindTooltip();
    l.poly.bindTooltip(l.name,{permanent:perm,direction:"center",className:"zt",opacity:.95});
  });
});
setCity("msk");
</script>
</body>
